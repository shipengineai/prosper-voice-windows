# Builds ProsperVoice.exe on a clean Windows machine and publishes it as a GitHub Release.
# Push a tag to release:  git tag v1.1  then  git push origin v1.1
# Or run it by hand from the Actions tab with a tag name (an existing release gets its files replaced).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.1 (created on the selected branch if it doesn't exist)"
        required: true

permissions:
  contents: write # create the release and upload its files; nothing else

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: call build.cmd

      - name: Self-test
        shell: cmd
        run: call tests\run.cmd --no-mic

      - name: Checksums
        shell: pwsh
        run: |
          $files = "dist\ProsperVoice.exe", "install.cmd"
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), (Split-Path $_ -Leaf) } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish
        shell: pwsh
        run: |
          $assets = "dist\ProsperVoice.exe", "install.cmd", "SHA256SUMS.txt"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
          } else {
            $title = "Prosper Voice " + $env:TAG.TrimStart("v")
            gh release create $env:TAG @assets --target $env:GITHUB_SHA --title $title --notes-file .github/release-notes.md --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
